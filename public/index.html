<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>HYG Portal</title>
    <meta name="theme-color" content="#f8fafc" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HYG Portal" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make html/body and root full-height, supporting 100dvh for iOS Safari / PWA */
      html,
      body {
        width: 100%;
        height: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
        background-color: #f8fafc;
        overflow: hidden;
        overscroll-behavior-y: none;
      }
      @supports (height: 100svh) {
        html,
        body {
          min-height: 100svh;
        }
      }
      @supports (height: 100dvh) {
        html,
        body {
          height: 100dvh;
          min-height: 100dvh;
        }
      }
      @supports (-webkit-touch-callout: none) {
        html,
        body {
          min-height: -webkit-fill-available;
        }
      }
      body {
        -webkit-overflow-scrolling: touch;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        min-height: 100%;
        width: 100%;
        flex: 1;
        background-color: #f8fafc;
      }
      @supports (height: 100svh) {
        #root {
          min-height: 100svh;
        }
      }
      @supports (height: 100dvh) {
        #root {
          height: 100dvh;
          min-height: 100dvh;
        }
      }
      @supports (-webkit-touch-callout: none) {
        #root {
          min-height: -webkit-fill-available;
        }
      }
    </style>
    <!-- Disable auto-zoom in mobile Safari/WebKit and PWA when selecting input fields -->
    <style id="prevent-auto-zoom">
      @media screen and (max-width: 1024px), (pointer: coarse) {
        input:not([type="checkbox"]):not([type="radio"]),
        textarea,
        select {
          font-size: 16px !important;
        }
      }
      input,
      textarea,
      select {
        touch-action: auto !important;
      }
    </style>
    <link rel="icon" href="/favicon.ico"/>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var reqId = params.get('requestId') || params.get('request_id') || params.get('id');
          if (!reqId && window.location.hash) {
            var hashMatch = window.location.hash.match(/[?&](?:requestId|request_id|id)=([a-zA-Z0-9_-]+)/i);
            if (hashMatch) reqId = hashMatch[1];
          }
          if (reqId) {
            var isStandalone = (window.navigator && window.navigator.standalone) || window.matchMedia('(display-mode: standalone)').matches;
            if (isStandalone) {
              // User is already inside the installed PWA window! React will automatically route and open the request modal.
              return;
            }

            var ua = navigator.userAgent || '';
            var isAndroid = /android/i.test(ua);
            var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;

            // Only show Open App banner on Android (native APK) or in browser
            if (isAndroid) {
              window.addEventListener('DOMContentLoaded', function() {
                if (document.getElementById('hyg-deep-link-banner')) return;
                var banner = document.createElement('div');
                banner.id = 'hyg-deep-link-banner';
                banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999999;background-color:#071426;color:#ffffff;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 14px rgba(0,0,0,0.35);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:13px;';

                var appSchemeUrl = 'hygportal://approval?requestId=' + encodeURIComponent(reqId);
                var openUrl = isAndroid
                  ? 'intent://approval?requestId=' + encodeURIComponent(reqId) + '#Intent;scheme=hygportal;package=com.hyg.portal;end'
                  : appSchemeUrl;

                banner.innerHTML = [
                  '<div style="display:flex;align-items:center;gap:10px;min-width:0;flex:1;">',
                  '  <img src="/pwa-icon.png" style="width:34px;height:34px;border-radius:8px;flex-shrink:0;" alt="HYG" />',
                  '  <div style="min-width:0;">',
                  '    <div style="font-weight:700;color:#f8fafc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">HYG Portal App</div>',
                  '    <div style="color:#94a3b8;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Open request in mobile app</div>',
                  '  </div>',
                  '</div>',
                  '<div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">',
                  '  <a href="' + openUrl + '" style="background:#2563eb;color:#ffffff;padding:7px 14px;border-radius:6px;font-weight:600;text-decoration:none;font-size:12px;display:inline-block;">Open App</a>',
                  '  <button id="hyg-close-deep-banner" style="background:none;border:none;color:#94a3b8;font-size:20px;line-height:1;cursor:pointer;padding:0 4px;">&times;</button>',
                  '</div>'
                ].join('');

                document.body.prepend(banner);

                var closeBtn = document.getElementById('hyg-close-deep-banner');
                if (closeBtn) {
                  closeBtn.onclick = function() {
                    banner.remove();
                  };
                }
              });
            }
          }
        } catch (e) {
          // Ignore fallback errors
        }
      })();
    </script>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
